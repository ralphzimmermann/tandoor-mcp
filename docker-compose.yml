services:
  # Production-style ChatGPT deployment. These services are behind a profile so
  # the local Tandoor integration-test stack below remains unchanged.
  mcp-tandoor:
    profiles:
      - chatgpt
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Deployment hosts build here and have seen Docker Hub availability and
        # rate-limit failures, so default to the Public ECR mirror of the
        # official image. CI and plain `docker build` keep the Dockerfile's
        # Docker Hub default.
        RUST_IMAGE: ${RUST_IMAGE:-public.ecr.aws/docker/library/rust:1.89-slim-bookworm}
    restart: unless-stopped
    environment:
      # Defaults keep the non-profile integration-test stack usable without a
      # tunnel .env; production ChatGPT deployments should set the public URL.
      TANDOOR_BASE_URL: ${TANDOOR_BASE_URL:-http://web_recipes:80}
      TANDOOR_AUTH_TOKEN: ${TANDOOR_AUTH_TOKEN:-}
      BIND_ADDR: 0.0.0.0:3001
      # Keep rmcp's DNS-rebinding protection enabled while permitting the
      # tunnel sidecar to address this service by its Compose DNS name.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,::1,mcp-tandoor}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_THUMBNAIL_PREFIX: ${S3_THUMBNAIL_PREFIX:-thumbnails/}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      THUMBNAIL_URL_TTL_SECS: ${THUMBNAIL_URL_TTL_SECS:-86400}
      THUMBNAIL_MAX_EDGE: ${THUMBNAIL_MAX_EDGE:-512}
      RUST_LOG: ${RUST_LOG:-info}
      # Blank disables the exporter and retains formatted Docker logs only.
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-tandoor-mcp}
      NEW_RELIC_OTLP_ENDPOINT: ${NEW_RELIC_OTLP_ENDPOINT:-https://otlp.nr-data.net:4318}
      NEW_RELIC_ENVIRONMENT_NAME: ${NEW_RELIC_ENVIRONMENT_NAME:-}
    expose:
      - "3001"
    networks:
      - default

  # OpenAI recommends running tunnel-client beside the private MCP server.
  # The Compose service name is required here: 127.0.0.1 would refer to this
  # sidecar itself, not to mcp-tandoor.
  tunnel-client:
    profiles:
      - chatgpt
    image: ghcr.io/openai/tunnel-client:v0.0.17
    restart: unless-stopped
    depends_on:
      - mcp-tandoor
    environment:
      CONTROL_PLANE_API_KEY: ${OPENAI_API_KEY:-}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:-}
      MCP_SERVER_URL: http://mcp-tandoor:3001/mcp
      LOG_LEVEL: ${TUNNEL_LOG_LEVEL:-info}
      LOG_FORMAT: json
    networks:
      - default

  # Optional local S3-compatible service for integration testing. Start it
  # together with the chatgpt profile and the MinIO values documented in
  # docs/thumbnails.md.
  minio:
    profiles:
      - s3-dev
    # The upstream community images were withdrawn in 2026. Chainguard keeps a
    # maintained, anonymously pullable development image.
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin123}
      MINIO_SERVER_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - default

  minio-init:
    profiles:
      - s3-dev
    image: amazon/aws-cli:2.31.23
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c '
      until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do sleep 2; done;
      aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$${S3_BUCKET}" >/dev/null 2>&1 ||
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "$${S3_BUCKET}";
      aws --endpoint-url http://minio:9000 s3api put-bucket-lifecycle-configuration \
        --bucket "$${S3_BUCKET}" \
        --lifecycle-configuration "{\"Rules\":[{\"ID\":\"ExpireRecipeThumbnails\",\"Status\":\"Enabled\",\"Filter\":{\"Prefix\":\"thumbnails/\"},\"Expiration\":{\"Days\":90},\"AbortIncompleteMultipartUpload\":{\"DaysAfterInitiation\":7}}]}";
      '
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-tandoor-mcp-thumbnails}
    networks:
      - default

  db_recipes:
    restart: always
    image: postgres:16-alpine
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    env_file:
      - ./.env.dev
    networks:
      - default

  web_recipes:
    restart: always
    image: vabene1111/recipes:latest
    env_file:
      - ./.env.dev
    volumes:
      - ./staticfiles:/opt/recipes/staticfiles
      - ./mediafiles:/opt/recipes/mediafiles
    depends_on:
      - db_recipes
    networks:
      - default
    ports:
      - "${TANDOOR_TEST_PORT:-8080}:80"

networks:
  default:

volumes:
  minio-data:
