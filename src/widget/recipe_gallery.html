<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- The server inlines widget/shared.css and widget/shared.js at the
       @include markers below (see widget_html in server.rs). This file holds
       only what is specific to the recipe gallery: one card per recipe. -->
  <style>
    /* @include shared.css */
  </style>
</head>
<body>
  <p id="status">Preparing recipe photos…</p>
  <main id="gallery" class="cards" aria-live="polite"></main>
  <script>
    // @include shared.js
    (() => {
      const gallery = createGallery({
        toolName: "get_recipe_gallery",
        appName: "tandoor-recipe-gallery",
        appVersion: "2.1.0",
        copy: {
          waiting: "Waiting for recipe photos…",
          loading: "Loading recipe photos…",
          failed: "The recipe photos could not be loaded. Ask for the recipe gallery again.",
          cannotConnect: "The recipe gallery could not connect to ChatGPT. Please try again.",
          retrying: "The recipe gallery is retrying its connection…"
        },
        fetchInput: input => (Array.isArray(input?.recipe_ids) ? { recipe_ids: input.recipe_ids } : null),
        refreshInput: data => ({ recipe_ids: data.items.map(item => item.recipe_id) }),
        render
      });
      const { element, photo, nameLink, tags, metaRow } = gallery;

      function card(item) {
        const article = element("article", "card");
        article.append(photo(item));
        const content = element("div", "content");
        const heading = element("header", "heading");
        heading.append(nameLink(item));
        content.append(heading);
        if (item.description) content.append(element("p", "description", item.description));
        // All keywords are shown; the card grows and notifyHeight() reports it.
        for (const part of [tags(item.keywords), metaRow(item)]) if (part) content.append(part);
        article.append(content);
        return article;
      }
      function render(result) {
        const data = gallery.mergeGalleryData(result, "recipe_id");
        if (!data) return null;
        const root = document.getElementById("gallery");
        root.replaceChildren();
        if (!data.items.length) {
          gallery.setStatus("No recipes were found.");
          return data;
        }
        document.getElementById("status").hidden = true;
        for (const item of data.items) root.append(card(item));
        gallery.notifyHeight();
        return data;
      }

      gallery.start();
    })();
  </script>
</body>
</html>
