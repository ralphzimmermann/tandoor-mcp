<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- The server inlines widget/shared.css and widget/shared.js at the
       @include markers below (see widget_html in server.rs). This file holds
       only what is specific to the meal plan: day sections, the meal-type
       badge, the plan title, and the plan note. -->
  <style>
    /* @include shared.css */
    .gallery { display: grid; gap: 30px; }
    .day { display: grid; gap: 14px; }
    .day-title {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .day-count { font-weight: 500; text-transform: none; letter-spacing: 0; }
    .meal-type {
      position: absolute;
      top: 14px;
      left: 14px;
      max-width: calc(100% - 28px);
      padding: 7px 12px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, white 30%, transparent);
      border-radius: 999px;
      color: white;
      background: color-mix(in srgb, black 58%, transparent);
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }
    .plan-title { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
    .note {
      display: grid;
      gap: 6px;
      margin: 2px 0 0;
      padding: 12px 14px;
      border-left: 3px solid color-mix(in srgb, CanvasText 30%, transparent);
      border-radius: 0 10px 10px 0;
      background: var(--subtle);
    }
    .note-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .note-text { margin: 0; font-size: 14.5px; line-height: 1.55; color: color-mix(in srgb, CanvasText 82%, transparent); white-space: pre-line; }
    .note-text.clamped { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
    .note-toggle {
      justify-self: start;
      padding: 0;
      border: 0;
      background: none;
      color: var(--text);
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    @media (max-width: 560px) {
      .gallery { gap: 24px; }
    }
  </style>
</head>
<body>
  <p id="status">Preparing your meal plan…</p>
  <main id="gallery" class="gallery" hidden aria-live="polite"></main>
  <script>
    // @include shared.js
    (() => {
      const gallery = createGallery({
        toolName: "get_meal_plan_gallery",
        appName: "tandoor-meal-plan-gallery",
        appVersion: "3.1.0",
        copy: {
          waiting: "Waiting for your meal plan…",
          loading: "Loading your meal plan…",
          failed: "The meal plan could not be loaded. Ask for the meal-plan gallery again.",
          cannotConnect: "The meal-plan gallery could not connect to ChatGPT. Please try again.",
          retrying: "The meal-plan gallery is retrying its connection…"
        },
        // Without the original arguments, fall back to today's plan.
        fetchInput: input => input ?? { from_date: localDate(), to_date: localDate() },
        refreshInput: data => {
          const input = { from_date: data.from_date, to_date: data.to_date };
          if (data.meal_type_filter) input.meal_type = data.meal_type_filter;
          return input;
        },
        render
      });
      const { element, photo, nameLink, tags, metaRow, notifyHeight } = gallery;

      // --- formatting ----------------------------------------------------
      function localDate() {
        const now = new Date();
        return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      }
      function locale() {
        return window.openai?.locale || navigator.language || "en";
      }
      function formatDate(iso) {
        const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
        if (!match) return iso || "Unscheduled";
        const date = new Date(Date.UTC(+match[1], +match[2] - 1, +match[3]));
        try {
          return new Intl.DateTimeFormat(locale(), { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" }).format(date);
        } catch {
          return iso;
        }
      }

      // --- rendering -----------------------------------------------------
      function heading(item) {
        const block = element("header", "heading");
        block.append(nameLink(item));
        // The plan title usually repeats the recipe name; show it only when it adds information.
        const title = (item.title || "").trim();
        if (title && !title.toLowerCase().includes((item.display_name || "").toLowerCase())) {
          block.append(element("p", "plan-title", title));
        }
        return block;
      }
      function note(item) {
        const text = (item.note || "").trim();
        if (!text) return null;
        const block = element("div", "note");
        block.append(element("span", "note-label", "Plan note"));
        const body = element("p", "note-text", text);
        block.append(body);
        if (text.length > 220) {
          body.classList.add("clamped");
          const toggle = element("button", "note-toggle", "Show more");
          toggle.type = "button";
          toggle.addEventListener("click", () => {
            const clamped = body.classList.toggle("clamped");
            toggle.textContent = clamped ? "Show more" : "Show less";
            notifyHeight();
          });
          block.append(toggle);
        }
        return block;
      }
      function card(item) {
        const article = element("article", "card");
        const media = photo(item);
        media.append(element("span", "meal-type", item.meal_type || "Meal"));
        article.append(media);
        const content = element("div", "content");
        content.append(heading(item));
        if (item.description) content.append(element("p", "description", item.description));
        for (const part of [tags(item.keywords, 8), metaRow(item), note(item)]) if (part) content.append(part);
        article.append(content);
        return article;
      }
      function daySection(date, items) {
        const section = element("section", "day");
        const title = element("h2", "day-title", formatDate(date));
        title.append(element("span", "day-count", `· ${items.length} ${items.length === 1 ? "meal" : "meals"}`));
        section.append(title);
        const cards = element("div", "cards");
        for (const item of items) cards.append(card(item));
        section.append(cards);
        return section;
      }
      function render(result) {
        const data = gallery.mergeGalleryData(result, "meal_plan_id");
        if (!data) return null;
        const root = document.getElementById("gallery");
        root.replaceChildren();
        if (!data.items.length) {
          gallery.setStatus("No meal-plan entries were found for this range.");
          root.hidden = true;
          return data;
        }
        const byDay = new Map();
        for (const item of data.items) {
          const key = item.date || "";
          if (!byDay.has(key)) byDay.set(key, []);
          byDay.get(key).push(item);
        }
        for (const [date, items] of byDay) root.append(daySection(date, items));
        document.getElementById("status").hidden = true;
        root.hidden = false;
        notifyHeight();
        return data;
      }

      gallery.start();
    })();
  </script>
</body>
</html>
