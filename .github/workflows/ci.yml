name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast unit tests — no external services required
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests (no network/Docker required)
        run: cargo test --lib --test test_types --test test_api_shapes --test test_protocol

  # Full integration tests against a live Tandoor instance
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tandoor
          POSTGRES_USER: tandoor
          POSTGRES_PASSWORD: tandoor
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Start Tandoor
        run: |
          docker run -d --name tandoor \
            --network host \
            -e DB_ENGINE=django.db.backends.postgresql \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=tandoor \
            -e POSTGRES_USER=tandoor \
            -e POSTGRES_PASSWORD=tandoor \
            -e SECRET_KEY=ci-test-secret-key \
            -e TANDOOR_PORT=8080 \
            -e ALLOWED_HOSTS="*" \
            vabene1111/recipes:latest

      - name: Wait for Tandoor to be ready
        run: |
          for i in $(seq 1 30); do
            if ! docker inspect --format='{{.State.Running}}' tandoor 2>/dev/null | grep -q true; then
              echo "Tandoor container is not running; dumping logs:"
              docker logs tandoor 2>&1 || true
              exit 1
            fi
            if curl -sf --max-time 3 http://localhost:8080/ -o /dev/null; then
              echo "Tandoor is ready"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
          echo "Tandoor never became ready; dumping logs:"
          docker logs tandoor 2>&1 || true
          exit 1

      - name: Create test user and get auth token
        run: |
          set -euo pipefail
          PYTHON=/opt/recipes/venv/bin/python
          # Wait for the container's own startup migrations to finish
          MIGRATIONS_READY=false
          for i in $(seq 1 30); do
            MIGRATIONS=$(docker exec tandoor $PYTHON /opt/recipes/manage.py showmigrations \
              2>/dev/null || true)
            if printf '%s\n' "$MIGRATIONS" | grep -q "\[X\]" \
                && ! printf '%s\n' "$MIGRATIONS" | grep -q "\[ \]"; then
              echo "Migrations complete"
              MIGRATIONS_READY=true
              break
            fi
            echo "Waiting for migrations... ($i/30)"
            sleep 5
          done
          if [ "$MIGRATIONS_READY" != true ]; then
            echo "Tandoor migrations did not complete"
            docker logs tandoor 2>&1 || true
            exit 1
          fi
          SETUP_OUTPUT=$(docker exec tandoor $PYTHON /opt/recipes/manage.py shell -c "
          from django.contrib.auth import get_user_model
          from django.contrib.auth.models import Group
          from cookbook.models import Space, UserSpace

          User = get_user_model()
          u, _ = User.objects.get_or_create(username='testuser')
          u.set_password('testpass123')
          u.is_superuser = True
          u.is_staff = True
          u.save()

          space, _ = Space.objects.get_or_create(
              name='CI',
              defaults={'created_by': u},
          )
          user_space, _ = UserSpace.objects.get_or_create(
              user=u,
              space=space,
              defaults={'active': True},
          )
          user_space.active = True
          user_space.save()
          for group_name in ('user', 'admin'):
              group, _ = Group.objects.get_or_create(name=group_name)
              user_space.groups.add(group)

          # Tandoor 2.7 removed the /api-token-auth/ endpoint, so mint the API
          # token the same way that view did: an oauth2_provider AccessToken
          # with Tandoor's 'tda_' prefix and 'read write app' scope, which
          # OAuth2Authentication still accepts as a Bearer token.
          import uuid
          from django.utils import timezone
          from oauth2_provider.models import AccessToken
          token = AccessToken.objects.create(
              user=u,
              token='tda_' + str(uuid.uuid4()).replace('-', '_'),
              expires=timezone.now() + timezone.timedelta(days=1),
              scope='read write app',
          )
          print('CI_TOKEN=' + token.token)
          ")
          printf '%s\n' "$SETUP_OUTPUT" | grep -v '^CI_TOKEN=' || true
          TOKEN=$(printf '%s\n' "$SETUP_OUTPUT" | sed -n 's/^CI_TOKEN=//p' | tail -n 1)
          test -n "$TOKEN"
          # Prove the token works before spending time on the test build.
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/space/ -o /dev/null
          echo "::add-mask::$TOKEN"
          echo "TANDOOR_AUTH_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Run integration tests
        env:
          TANDOOR_BASE_URL: http://localhost:8080
          TANDOOR_TEST_EXTERNAL_SERVER: "true"
        run: cargo test --tests -- --test-threads=1

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit

  # Docker build verification (no push)
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: mcp-tandoor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container starts and serves MCP
        run: |
          docker run -d --name mcp-tandoor-ci \
            -e TANDOOR_AUTH_TOKEN=ci-startup-token \
            -p 3001:3001 mcp-tandoor:ci
          for i in $(seq 1 20); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -X POST http://127.0.0.1:3001/mcp || true)
            if [ "$status" != "000" ]; then
              docker logs mcp-tandoor-ci
              exit 0
            fi
            sleep 1
          done
          docker logs mcp-tandoor-ci
          exit 1
