[package]
name = "mcp-tandoor"
version = "0.2.0"
edition = "2021"

[dependencies]
rmcp = { version = "3.6", features = ["server", "transport-streamable-http-server", "macros"] }
axum = "0.8"
reqwest = { version = "0.13", features = ["json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.46", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.103"
base64 = "0.22"
urlencoding = "2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
serial_test = "3.3"
pretty_assertions = "1.4"
test-log = "0.2"
env_logger = "0.11"
log = "0.4"
